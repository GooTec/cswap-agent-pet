name: Release mac

on:
  workflow_dispatch:
  push:
    tags: ['mac-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check mac version
        id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < mac/VERSION)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "mac-v$version"; fi
      - run: ./scripts/test.sh
      - run: ./scripts/package-mac.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-mac-${{ matrix.arch }}
          path: build/release/mac/${{ steps.version.outputs.value }}/
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-mac-*
          merge-multiple: true
          path: release
      - run: python3 scripts/check-release.py mac release
      - name: Create mac draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < mac/VERSION)
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "Chiikawa Agent Pet mac v$version" --notes-file "docs/releases/mac-v$version.md"
