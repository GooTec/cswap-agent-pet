name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Windows version
        id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < windows/VERSION)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "windows-v$version"; fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: choco install nsis --yes --no-progress
      - run: ./scripts/package-windows.ps1
      - name: Check Windows installation
        shell: pwsh
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          ./scripts/test-installed-windows.ps1 -Installer "./build/release/windows/$version/ChiikawaPet-$version-win-x64-setup.exe"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-windows-x64
          path: build/release/windows/${{ steps.version.outputs.value }}/
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-windows-x64
          path: release
      - run: python3 scripts/check-release.py windows release
      - name: Create Windows draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < windows/VERSION)
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "Chiikawa Agent Pet Windows v$version" --notes-file "docs/releases/windows-v$version.md"
